[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "infrastructure-impact"
version = "0.4.1"
description = "Evidence-led infrastructure CVE product impact intelligence"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]
keywords = ["cve", "infrastructure", "vulnerability", "csaf", "security-advisories"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.26,<5", "waitress>=3.0.2,<4"]

[project.scripts]
impact = "infrastructure_impact.cli:main"

[dependency-groups]
dev = ["ruff>=0.12,<1", "pytest>=8.3,<10"]
build = ["build>=1.3,<2", "hatchling>=1.27,<2"]
hosted = [
    "cryptography>=50,<51",
]

[tool.hatch.build.targets.wheel]
packages = ["infrastructure_impact"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["site", "data", "benchmark/snapshots", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
