services:
  proxy:
    image: caddy:2-alpine
    environment:
      IMPACT_DOMAIN: ${IMPACT_DOMAIN:?Set IMPACT_DOMAIN to the server's DNS name}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
