# Public runner: Pages, encrypted recovery and a small publication-state pointer.
# Requires secret IMPACT_STATE_KEY; never seed it with an existing local vault.
# Set repository variable IMPACT_SOURCE_COMMIT to a reviewed full source commit.
name: Collect and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: service-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: service
          ref: publication-state
      - name: Check pinned source
        env:
          SOURCE_COMMIT: ${{ vars.IMPACT_SOURCE_COMMIT }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ vars.IMPACT_SOURCE_COMMIT }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.21
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install locked source
        working-directory: source
        run: uv sync --frozen --no-dev --group hosted
      - name: Restore, collect, audit and back up privately
        working-directory: source
        env:
          IMPACT_SOURCE_COMMIT: ${{ vars.IMPACT_SOURCE_COMMIT }}
          IMPACT_STATE_KEY: ${{ secrets.IMPACT_STATE_KEY }}
          PRIVATE_STATE: ${{ github.workspace }}/service/state
          PUBLIC_OUTPUT: ${{ runner.temp }}/public-publication
          BASE_PATH: /${{ github.event.repository.name }}/
          GH_TOKEN: ${{ github.token }}
          RECOVERY_STORAGE: ${{ vars.IMPACT_RECOVERY_STORAGE || 'git' }}
          REPARSE_LIMIT: ${{ vars.IMPACT_REPARSE_LIMIT || '0' }}
        run: |
          set -euo pipefail
          recovery_args=()
          case "$RECOVERY_STORAGE" in
            git) ;;
            github-draft) recovery_args=(--recovery-storage github-draft --recovery-repository "$GITHUB_REPOSITORY") ;;
            *) echo 'Unsupported recovery storage setting'; exit 1 ;;
          esac
          [[ "$REPARSE_LIMIT" =~ ^[0-9]+$ ]]
          if test "$REPARSE_LIMIT" -gt 0; then
            recovery_args+=(--reparse-limit "$REPARSE_LIMIT")
          fi
          uv run --no-dev python ops/hosted_job.py --state-dir "$PRIVATE_STATE" --output "$PUBLIC_OUTPUT" --base-path "$BASE_PATH" --encrypted-state "${recovery_args[@]}"
      - name: Retain only encrypted recovery copies
        if: always()
        working-directory: service
        env:
          IMPACT_STATE_KEY: ${{ secrets.IMPACT_STATE_KEY }}
          PRIVATE_STATE: ${{ github.workspace }}/service/state
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test -f state/current.json; then
            git config user.name 'Infrastructure Impact collector'
            git config user.email 'collector@users.noreply.github.com'
            "$GITHUB_WORKSPACE/source/.venv/bin/python" "$GITHUB_WORKSPACE/source/ops/hosted_job.py" --state-dir "$PRIVATE_STATE" --encrypted-state --validate-encrypted-state
            git add state
            if ! git diff --cached --quiet; then
              git commit -m 'Retain collected evidence and recovery copies'
              git push
            fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/public-publication
      - name: Publish sanitized generation
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public availability and freshness
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        working-directory: source
        run: python checks/public_health.py "$PUBLIC_URL"
