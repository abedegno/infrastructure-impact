# Canonical non-publishing certification workflow; keep the installed copy identical.
# Certifies a disposable full hosted candidate; never promotes accepted recovery.
name: Certify full hosted candidate
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Reviewed source commit (40 lowercase hexadecimal characters)'
        required: true
        type: string
      switching_analysis_profile:
        description: 'Optional reviewed switching analysis profile; blank uses the repository variable'
        required: false
        type: string
        default: ''
      retained_only:
        description: 'Offline preview of retained switching fixes; no target import or captures'
        required: false
        type: boolean
        default: false
      previous_capture_run_id:
        description: 'Optional earlier certification run ID containing encrypted captures'
        required: false
        type: string
permissions:
  contents: write
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate manual inputs
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_capture_run_id }}
          RETAINED_ONLY: ${{ inputs.retained_only }}
          SWITCHING_ANALYSIS_PROFILE: ${{ inputs.switching_analysis_profile || vars.IMPACT_SWITCHING_ANALYSIS_PROFILE || '' }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ -z "$PREVIOUS_RUN_ID" || "$PREVIOUS_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "${RETAINED_ONLY:-false}" == false || "${RETAINED_ONLY:-false}" == true ]] || exit 1
          [[ "${RETAINED_ONLY:-false}" != true || -z "$PREVIOUS_RUN_ID" ]] || exit 1
          [[ -z "${SWITCHING_ANALYSIS_PROFILE:-}" || "$SWITCHING_ANALYSIS_PROFILE" = campus-switching-openvuln-2026-11-14-v1 ]] || exit 1
          [[ "${RETAINED_ONLY:-false}" != true || -z "${SWITCHING_ANALYSIS_PROFILE:-}" ]] || exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: publication-state
          path: accepted
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.21
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install locked source
        working-directory: source
        run: uv sync --frozen --no-dev --group hosted
      - name: Validate selected analysis capability
        working-directory: source
        env:
          SWITCHING_ANALYSIS_PROFILE: ${{ inputs.switching_analysis_profile || vars.IMPACT_SWITCHING_ANALYSIS_PROFILE || '' }}
        run: |
          set -euo pipefail
          if test -n "${SWITCHING_ANALYSIS_PROFILE:-}"; then
            uv run --no-sync impact target-import stage --help | grep -q -- --switching-analysis-profile
            uv run --no-sync python - <<'PYCODE'
          import os
          from infrastructure_impact.application.switching_analysis_profiles import hosted_profile
          hosted_profile(os.environ["SWITCHING_ANALYSIS_PROFILE"], publication_format="v2")
          PYCODE
          fi
      - name: Restore accepted baseline privately
        id: restore
        working-directory: source
        env:
          IMPACT_STATE_KEY: ${{ secrets.IMPACT_STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VAULT_PROFILE: ${{ vars.IMPACT_VAULT_PROFILE || 'standard' }}
        run: |
          set -euo pipefail
          umask 077
          uv run --no-sync python ops/hosted_job.py \
            --state-dir "$GITHUB_WORKSPACE/accepted/state" --encrypted-state \
            --recovery-storage github-draft --recovery-repository "$GITHUB_REPOSITORY" \
            --vault-profile "$VAULT_PROFILE" \
            --restore-only "$RUNNER_TEMP/private-home/data/intel.sqlite3" \
            > "$RUNNER_TEMP/restore-result.json" 2> "$RUNNER_TEMP/restore-stderr"
      - name: Download prior encrypted captures
        if: ${{ !inputs.retained_only && inputs.previous_capture_run_id != '' }}
        env:
          PREVIOUS_RUN_ID: ${{ inputs.previous_capture_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$PREVIOUS_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$PREVIOUS_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name candidate-certification-captures --dir "$RUNNER_TEMP/previous-captures"
      - name: Authenticate prior captures
        if: ${{ !inputs.retained_only && inputs.previous_capture_run_id != '' }}
        working-directory: source
        env:
          IMPACT_STATE_KEY: ${{ secrets.IMPACT_STATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          from infrastructure_impact.collection.target_import_profiles import profile
          from ops import hosted_job as hosted

          root = Path(os.environ["RUNNER_TEMP"])
          selected = profile("campus-switching-public-gap-2026-11-07-v1")
          state = root / "previous-captures"
          cache = root / "private-home/captures" / (selected.fingerprint + ".sqlite3")
          key = os.environ["IMPACT_STATE_KEY"]
          hosted.validate_encrypted_state(state, key)
          if not hosted.restore(state, cache, key):
              raise RuntimeError("Requested acquisition checkpoint is unavailable")
          PY
      - name: Preview full hosted baseline
        if: ${{ !inputs.retained_only }}
        working-directory: source
        run: |
          set -euo pipefail
          umask 077
          export IMPACT_SOURCES="$GITHUB_WORKSPACE/source/infrastructure_impact/resources/sources.json"
          uv run --no-sync impact target-import preview \
            --database "$RUNNER_TEMP/private-home/data/intel.sqlite3" \
            --profile campus-switching-public-gap-2026-11-07-v1 \
            --output "$RUNNER_TEMP/private-preview.json" \
            > "$RUNNER_TEMP/preview-stdout" 2> "$RUNNER_TEMP/preview-stderr"
      - name: Stage disposable full candidate
        id: stage
        env:
          SWITCHING_ANALYSIS_PROFILE: ${{ inputs.switching_analysis_profile || vars.IMPACT_SWITCHING_ANALYSIS_PROFILE || '' }}
        if: ${{ !inputs.retained_only }}
        working-directory: source
        run: |
          set -euo pipefail
          umask 077
          export IMPACT_SOURCES="$GITHUB_WORKSPACE/source/infrastructure_impact/resources/sources.json"
          analysis_args=()
          if test -n "${SWITCHING_ANALYSIS_PROFILE:-}"; then
            analysis_args+=(--switching-analysis-profile "$SWITCHING_ANALYSIS_PROFILE")
          fi
          uv run --no-sync impact target-import stage ${analysis_args[@]+"${analysis_args[@]}"} \
            --database "$RUNNER_TEMP/private-home/data/intel.sqlite3" \
            --home "$RUNNER_TEMP/private-home" \
            --profile campus-switching-public-gap-2026-11-07-v1 \
            --preview "$RUNNER_TEMP/private-preview.json" \
            --output "$RUNNER_TEMP/private-stage" \
            --base-path /infrastructure-impact/ --publication-format v2 \
            > "$RUNNER_TEMP/stage-result.json" 2> "$RUNNER_TEMP/stage-stderr"
      - name: Prepare selected public analysis artifacts
        id: analysis_public
        if: ${{ success() && !inputs.retained_only && steps.stage.outcome == 'success' && (inputs.switching_analysis_profile || vars.IMPACT_SWITCHING_ANALYSIS_PROFILE) != '' }}
        working-directory: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SWITCHING_ANALYSIS_PROFILE: ${{ inputs.switching_analysis_profile || vars.IMPACT_SWITCHING_ANALYSIS_PROFILE || '' }}
        run: |
          set -euo pipefail
          umask 077
          uv run --no-sync python - <<'PYCODE'
          import os
          from pathlib import Path
          from checks.switching_analysis_acceptance import prepare_artifacts

          prepare_artifacts(Path(os.environ["RUNNER_TEMP"]), os.environ["SWITCHING_ANALYSIS_PROFILE"], os.environ["SOURCE_COMMIT"])
          PYCODE
      - name: Preview retained switching fixes
        id: retained
        timeout-minutes: 40
        if: ${{ inputs.retained_only }}
        working-directory: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          umask 077
          export IMPACT_SOURCES="$GITHUB_WORKSPACE/source/infrastructure_impact/resources/sources.json"
          uv run --no-sync python ops/retained_preview_progress.py \
            --database "$RUNNER_TEMP/private-home/data/intel.sqlite3" \
            --public "$RUNNER_TEMP/private-retained-public" \
            --output "$RUNNER_TEMP/retained-preview-result.json" \
            --source-commit "$SOURCE_COMMIT" \
            --progress "$RUNNER_TEMP/retained-preview-progress.json"
      - name: Checkpoint private captures
        id: checkpoint
        if: ${{ always() && !inputs.retained_only && steps.stage.outcome != 'skipped' && steps.stage.outcome != '' }}
        working-directory: source
        env:
          IMPACT_STATE_KEY: ${{ secrets.IMPACT_STATE_KEY }}
          IMPACT_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          umask 077
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          from infrastructure_impact.collection.target_import_profiles import profile
          from ops import hosted_job as hosted

          root = Path(os.environ["RUNNER_TEMP"])
          selected = profile("campus-switching-public-gap-2026-11-07-v1")
          cache = root / "private-home/captures" / (selected.fingerprint + ".sqlite3")
          if cache.exists():
              state = root / "certification-captures"
              key = os.environ["IMPACT_STATE_KEY"]
              hosted.backup(state, cache, key)
              hosted.validate_encrypted_state(state, key)
              if not hosted.restore(state, root / "capture-readback.sqlite3", key):
                  raise RuntimeError("Acquisition readback failed")
          PY
      - name: Sanitize result metadata
        id: metadata
        if: ${{ always() && steps.restore.outcome != 'skipped' && steps.restore.outcome != '' }}
        working-directory: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          STAGE_OUTCOME: ${{ steps.stage.outcome }}
          RETAINED_ONLY: ${{ inputs.retained_only }}
          RETAINED_OUTCOME: ${{ steps.retained.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
        run: |
          set -euo pipefail
          umask 077
          uv run --no-sync python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from jsonschema import ValidationError
          from infrastructure_impact.application.import_candidate import parse_worker_diagnostics
          from infrastructure_impact.application.target_import_contracts import result_bytes
          from infrastructure_impact.collection.target_import_profiles import profile

          root = Path(os.environ["RUNNER_TEMP"])
          summary = {"source_commit": os.environ["SOURCE_COMMIT"],
                     "stage_step": os.environ["STAGE_OUTCOME"], "diagnostics": []}
          if os.environ.get("RESTORE_OUTCOME") == "failure":
              error = {"category": "unclassified"}
              log = root / "restore-stderr"
              if log.is_file():
                  with log.open("rb") as stream:
                      text = stream.read(65_536).decode("utf-8", errors="replace")
                  http = re.search(r"Recovery API returned HTTP ([1-5][0-9]{2})", text)
                  if http:
                      error = {"category": "remote_http", "http_status": int(http[1])}
                  elif "cryptography.fernet.InvalidToken" in text:
                      error = {"category": "authentication"}
                  elif "Encrypted public-runner state requires IMPACT_STATE_KEY" in text:
                      error = {"category": "missing_key"}
              summary["restore_error"] = error
          retained = os.environ.get("RETAINED_ONLY") == "true"
          if retained:
              from ops.switching_fix_preview import receipt_bytes
              from ops.retained_preview_progress import read_progress
              try:
                  summary["retained_progress"] = read_progress(root / "retained-preview-progress.json")
              except (OSError, ValueError, TypeError, AttributeError, KeyError, RecursionError, OverflowError):
                  pass
              summary["retained_step"] = os.environ.get("RETAINED_OUTCOME", "")
              receipt = root / "retained-preview-result.json"
              summary["retained_receipt_status"] = "missing"
              if receipt.is_file():
                  summary["retained_receipt_status"] = "invalid"
                  if receipt.stat().st_size <= 65_536:
                      try:
                          value = json.loads(receipt_bytes(json.loads(receipt.read_bytes())))
                          if value["source_commit"] != summary["source_commit"]:
                              raise ValueError("Source commit mismatch")
                          summary["retained_preview"] = value
                          summary["retained_receipt_status"] = "valid"
                      except (ValueError, TypeError, AttributeError, KeyError, RecursionError, ValidationError):
                          pass
          receipt = root / "stage-result.json"
          if not retained and receipt.is_file() and receipt.stat().st_size <= 2_000_000:
              try:
                  selected = profile("campus-switching-public-gap-2026-11-07-v1")
                  value = json.loads(result_bytes(json.loads(receipt.read_bytes()),
                                     selected=selected, publication_format="v2"))
                  for field in ("outcome", "failure_code", "fingerprint", "counters", "checks"):
                      summary[field] = value[field]
              except (ValueError, TypeError, AttributeError, KeyError, RecursionError, ValidationError):
                  summary["receipt_status"] = "invalid"
          log = root / "stage-stderr"
          if not retained and log.is_file():
              with log.open("rb") as stream:
                  summary["diagnostics"] = parse_worker_diagnostics(stream.read(65_536))
          output = root / "certification-result"
          output.mkdir()
          raw = json.dumps(summary, allow_nan=False) + "\n"
          if len(raw.encode()) > 65_536:
              raise ValueError("Certification metadata exceeds bound")
          (output / "result.json").write_text(raw)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && !inputs.retained_only && steps.checkpoint.outcome == 'success' }}
        with:
          name: candidate-certification-captures
          path: ${{ runner.temp }}/certification-captures
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.metadata.outcome == 'success' }}
        with:
          name: candidate-certification-result
          path: ${{ runner.temp }}/certification-result/result.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ success() && steps.analysis_public.outcome == 'success' }}
        with:
          name: candidate-certification-public
          path: ${{ runner.temp }}/private-stage/public
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ success() && steps.analysis_public.outcome == 'success' }}
        with:
          name: candidate-certification-analysis-proof
          path: ${{ runner.temp }}/public-analysis-proof
          if-no-files-found: error
          retention-days: 14
