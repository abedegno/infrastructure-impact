# Monitor the public Pages reader without accessing raw evidence or its key.
name: Public service health
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  actions: read
jobs:
  monitor:
    # Manual events can select a branch; event-SHA control code requires the default branch.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ vars.IMPACT_SOURCE_COMMIT }}
          persist-credentials: false
      - name: Check out operational control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: operational-control
          persist-credentials: false
      - name: Check public HTML, dataset age and fingerprints
        id: public-health
        env:
          PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          python3 checks/public_health.py "$PUBLIC_URL" | tee "$RUNNER_TEMP/public-health.json"
      - name: Summarize public health
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.public-health.outcome }}
        run: python3 operational-control/checks/public_health_receipt.py
      - name: Retain public health evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-health-${{ github.run_id }}
          path: ${{ runner.temp }}/public-health.json
          if-no-files-found: warn
          retention-days: 30
