# Monitor the public Pages reader without accessing raw evidence or its key.
name: Public service health
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  actions: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ vars.IMPACT_SOURCE_COMMIT }}
          persist-credentials: false
      - name: Check public HTML, dataset age and fingerprints
        env:
          PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 checks/public_health.py "$PUBLIC_URL" | tee "$RUNNER_TEMP/public-health.json"
      - name: Summarize the seven-day observation window and storage budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OBSERVATION_START: ${{ vars.IMPACT_RELIABILITY_START }}
          SCHEDULE_START: ${{ vars.IMPACT_SCHEDULE_OBSERVATION_START }}
        run: python3 checks/operations_report.py --repository "$REPOSITORY" --output "$RUNNER_TEMP/operations.json" --summary "$GITHUB_STEP_SUMMARY" --observation-start "$OBSERVATION_START" --health-report "$RUNNER_TEMP/public-health.json" --schedule-observation-start "$SCHEDULE_START"

      - name: Assess encrypted backup growth without downloading evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VAULT_PROFILE: ${{ vars.IMPACT_VAULT_PROFILE || 'standard' }}
        run: python3 checks/backup_storage.py --repository "$REPOSITORY" --output "$RUNNER_TEMP/backup-storage.json" --summary "$GITHUB_STEP_SUMMARY" --vault-profile "$VAULT_PROFILE"

      - name: Retain operational review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reliability-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/operations.json
            ${{ runner.temp }}/backup-storage.json
          if-no-files-found: warn
          retention-days: 30
