# Monitor the public Pages reader without accessing raw evidence or its key.
name: Public service health
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  actions: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ vars.IMPACT_SOURCE_COMMIT }}
          persist-credentials: false
      - name: Check public HTML, dataset age and fingerprints
        id: public-health
        env:
          PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          python3 checks/public_health.py "$PUBLIC_URL" | tee "$RUNNER_TEMP/public-health.json"
      - name: Summarize public health
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.public-health.outcome }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          receipt = Path(os.environ["RUNNER_TEMP"]) / "public-health.json"
          outcome = os.environ["CHECK_OUTCOME"]
          try:
              report = json.loads(receipt.read_text())
          except (OSError, ValueError):
              report = None
          verified = isinstance(report, dict) and report.get("status") == "fresh"
          if outcome != "success":
              report = {"status": "failed"}
          elif not verified:
              report = {"status": "unavailable"}
          report["check_outcome"] = outcome
          receipt.write_text(json.dumps(report, indent=2) + "\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write(
                  "\n## Public service health\n\n"
                  f"Check outcome: **{outcome}**; receipt status: **{report['status']}**.\n\n"
                  + "```json\n" + json.dumps(report, indent=2) + "\n```\n"
              )
          if outcome == "success" and not verified:
              raise SystemExit("Public-health receipt unavailable; successful health is unverified")
          PYTHON
      - name: Retain public health evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-health-${{ github.run_id }}
          path: ${{ runner.temp }}/public-health.json
          if-no-files-found: warn
          retention-days: 30
