# One-off activation operation on ops/seed-certified-captures only.
# Do not merge: main retains the nonpublishing certification workflow.
name: Seed verified acquisition captures
on:
  workflow_dispatch:
    inputs:
      source_commit:
        required: true
        type: string
      previous_capture_run_id:
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: service-publication
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate approved operation
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CAPTURE_RUN: ${{ inputs.previous_capture_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/ops/seed-certified-captures ]]
          [[ "$SOURCE_COMMIT" == 18579c312bc83397730d47122dcdb7459ca283dc ]]
          [[ "$CAPTURE_RUN" == 42536277051 ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: publication-state
          path: service
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.21
      - name: Install certified source
        working-directory: source
        run: uv sync --frozen --no-dev --group hosted
      - name: Download certified encrypted cache on runner only
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RUN: ${{ inputs.previous_capture_run_id }}
        run: |
          set -euo pipefail
          umask 077
          gh run view "$CAPTURE_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion | grep -qx success
          gh run download "$CAPTURE_RUN" --repo "$GITHUB_REPOSITORY" --name candidate-certification-result --dir "$RUNNER_TEMP/certificate"
          gh run download "$CAPTURE_RUN" --repo "$GITHUB_REPOSITORY" --name candidate-certification-captures --dir "$RUNNER_TEMP/captured"
      - name: Authenticate, verify targets and retain independent cache pointer
        working-directory: source
        env:
          IMPACT_STATE_KEY: ${{ secrets.IMPACT_STATE_KEY }}
          IMPACT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMPACT_SOURCES: ${{ github.workspace }}/source/infrastructure_impact/resources/sources.json
          GH_TOKEN: ${{ github.token }}
          VAULT_PROFILE: ${{ vars.IMPACT_VAULT_PROFILE || 'standard' }}
        run: |
          set -euo pipefail
          umask 077
          uv run --no-sync python - <<'PY'
          import json
          import os
          import subprocess
          from contextlib import closing
          from hashlib import sha256
          from pathlib import Path
          from infrastructure_impact.collection.target_import_profiles import profile
          from infrastructure_impact.recovery_policy import vault_limit
          from infrastructure_impact.storage import capture_cache
          from infrastructure_impact.storage.remote_recovery import GitHubDraftStore
          from ops import hosted_job as hosted

          temporary = Path(os.environ['RUNNER_TEMP'])
          service = Path(os.environ['GITHUB_WORKSPACE']) / 'service'
          certificate = temporary / 'certificate/result.json'
          if certificate.stat().st_size > 65536:
              raise ValueError('Certificate size')
          receipt = json.loads(certificate.read_bytes())
          assert receipt['source_commit'] == os.environ['IMPACT_SOURCE_COMMIT']
          assert receipt['outcome'] == 'completed'
          assert set(receipt['checks']) == {'audit_passed', 'capacity_passed', 'candidate_validated'}
          assert all(value is True for value in receipt['checks'].values())
          assert receipt['counters']['imported'] == 174
          selected = profile('campus-switching-public-gap-2026-11-07-v1')
          key = os.environ['IMPACT_STATE_KEY']
          limit = vault_limit(os.environ['VAULT_PROFILE'])
          source = temporary / 'captured'
          cache = temporary / 'private-cache.sqlite3'
          hosted.validate_encrypted_state(source, key)
          if not hosted.restore(source, cache, key, vault_limit_bytes=limit):
              raise RuntimeError('Capture restore failed')
          with closing(capture_cache.connect(cache)) as database:
              total = 0
              for target in selected.targets:
                  capture = capture_cache.lookup(database, target.fetch_url, target.source_sha256, selected.max_document_bytes)
                  if capture is None:
                      raise RuntimeError('Required verified capture unavailable')
                  total += len(capture['raw'])
          assert total == receipt['counters']['input_bytes'] <= selected.max_input_bytes
          accepted = service / 'state/current.json'
          before = sha256(accepted.read_bytes()).hexdigest()
          store = GitHubDraftStore(os.environ['GITHUB_REPOSITORY'])
          hosted.validate_current(accepted.parent, key, store=store)
          destination = service / 'acquisitions' / selected.fingerprint
          if destination.exists() or destination.is_symlink():
              raise RuntimeError('Acquisition destination already exists')
          hosted.backup_remote(destination, cache, key, store=store, vault_limit_bytes=limit)
          hosted.validate_current(destination, key, store=store)
          assert sha256(accepted.read_bytes()).hexdigest() == before
          relative = destination.relative_to(service).as_posix() + '/current.json'
          subprocess.run(['git', '-C', str(service), 'add', '--', relative], check=True)
          changed = subprocess.check_output(['git', '-C', str(service), 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert changed == [relative]
          subprocess.run(['git', '-C', str(service), 'diff', '--exit-code', '--', 'state'], check=True)
          print(json.dumps({'cache_ready': True, 'verified_targets': len(selected.targets), 'input_bytes': total, 'accepted_manifest_unchanged': True}))
          PY
      - name: Retain cache pointer without promoting accepted recovery
        working-directory: service
        run: |
          set -euo pipefail
          git config user.name 'Infrastructure Impact collector'
          git config user.email 'collector@users.noreply.github.com'
          git commit -m 'Retain certified exact-import acquisition cache'
          git push origin HEAD:publication-state
