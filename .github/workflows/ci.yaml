name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.21
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: uv sync --frozen --group build --group hosted
      - name: Check container dependency exports
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.lock
          uv export --frozen --only-group build --no-emit-project --format requirements-txt --output-file requirements-build.lock
          git diff --exit-code -- requirements.lock requirements-build.lock
      - run: uv run pytest -q
      - run: uv run python checks/release.py --output /tmp/public-source-check
      - run: uv run ruff check infrastructure_impact checks tests/test_architecture.py tests/test_expansion.py tests/test_release_sources.py tests/test_benchmark_boundaries.py tests/test_browser_capture.py tests/test_scorecards.py tests/test_arista_history.py tests/test_research_audit.py tests/test_reliability_review.py tests/test_archive.py tests/test_archive_listings.py tests/test_comparison_eligibility.py tests/test_evidence_quality.py tests/test_review_coverage.py tests/test_static_delivery.py tests/test_vendor_gaps.py tests/test_advisory_gaps.py tests/test_history_batches.py tests/test_research_foundations.py tests/test_component_statements.py tests/test_source_observations.py ops
      - run: uv run ruff format --check infrastructure_impact checks tests/test_architecture.py tests/test_expansion.py tests/test_release_sources.py tests/test_benchmark_boundaries.py tests/test_browser_capture.py tests/test_scorecards.py tests/test_arista_history.py tests/test_research_audit.py tests/test_reliability_review.py tests/test_archive.py tests/test_archive_listings.py tests/test_comparison_eligibility.py tests/test_evidence_quality.py tests/test_review_coverage.py tests/test_static_delivery.py tests/test_vendor_gaps.py tests/test_advisory_gaps.py tests/test_history_batches.py tests/test_research_foundations.py tests/test_component_statements.py tests/test_source_observations.py ops
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: uv run --group build python -m build --wheel --no-isolation
      - run: uv run python checks/distribution.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t infrastructure-impact:ci .
      - run: docker run --rm infrastructure-impact:ci plugins
      - run: docker compose config --quiet
