name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.21
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: uv sync --frozen --group build --group hosted
      - name: Check container dependency exports
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.lock
          uv export --frozen --only-group build --no-emit-project --format requirements-txt --output-file requirements-build.lock
          git diff --exit-code -- requirements.lock requirements-build.lock
      - run: uv run pytest -q
      - run: uv run python checks/release.py --output /tmp/public-source-check
      - run: uv run ruff check infrastructure_impact checks tests/test_architecture.py tests/test_expansion.py tests/test_release_sources.py tests/test_benchmark_boundaries.py tests/test_browser_capture.py tests/test_scorecards.py tests/test_arista_history.py tests/test_research_audit.py tests/test_reliability_review.py tests/test_archive.py tests/test_archive_listings.py tests/test_comparison_eligibility.py tests/test_evidence_quality.py tests/test_review_coverage.py tests/test_static_delivery.py tests/test_research_dossiers.py tests/test_vendor_gaps.py tests/test_advisory_gaps.py tests/test_history_batches.py tests/test_research_foundations.py tests/test_component_statements.py tests/test_source_observations.py tests/test_references.py tests/test_component_studies.py tests/test_source_selection.py tests/test_arista_legacy_scope.py tests/test_archive_replay.py tests/test_fortinet_ranges.py tests/test_f5_pdf.py tests/test_fortinet_openssh.py tests/test_arista_routing_scope.py tests/test_arista_management_scope.py tests/test_pan_notices.py tests/test_pan_bulletins.py tests/test_capacity_profiles.py tests/test_hosted_backup.py tests/test_juniper_apstra.py tests/test_normalizer_fingerprints.py tests/test_remediation_time.py tests/test_cisco_ucs.py tests/test_component_contract.py tests/test_checkpoint_index.py tests/test_remote_recovery.py tests/test_normalization_maintenance.py tests/test_product_cohorts.py tests/test_sbom_observations.py tests/test_build_inventory.py tests/test_build_pilot.py tests/test_investigations.py tests/test_disclosure_review.py tests/test_source_access.py tests/test_kev.py tests/test_kev_collection.py tests/test_kev_delivery.py tests/test_kev_monitor.py tests/test_eligibility_monitor.py tests/test_switching_monitor.py tests/test_switching_delivery.py tests/test_switching_summary_delivery.py tests/test_switching_evidence.py tests/test_switching_validation.py tests/test_switching_contracts.py tests/test_switching_final_fixes.py tests/test_switching_comparison.py tests/test_switching_backfill.py tests/test_cisco_openvuln.py tests/test_cisco_platform_scope.py tests/test_cvss_enrichment.py tests/test_writer_scaling.py tests/test_phase_events.py tests/test_aruba_text_coverage.py tests/test_arista_current_scope.py tests/test_arista_reconciliation.py tests/test_switching_scaling.py tests/test_coverage_notice_transitions.py tests/test_coverage_gaps.py tests/test_coverage_repairs_integration.py tests/test_cve_reconciliation_snapshot.py tests/test_cve_reconciliation_selectors.py tests/test_cve_reconciliation_state.py tests/test_cve_reconciliation_baseline.py tests/test_cve_reconciliation_report.py tests/test_cve_reconciliation_cli.py tests/test_current_evidence.py tests/test_arista_current_evidence.py tests/test_targeted_maintenance.py tests/test_current_evidence_delivery.py tests/test_current_evidence_monitor.py tests/test_hosted_maintenance.py tests/test_hosted_workflow_protocol.py tests/test_target_import_candidate.py tests/test_target_import_cli.py tests/test_target_import_contracts.py tests/test_target_import_distribution.py tests/test_target_import_preview.py tests/test_target_import_profiles.py tests/test_target_import_stage.py tests/test_target_import_transport.py tests/test_hosted_target_import.py ops tests/test_publication_v2_codec.py tests/test_publication_v2.py tests/test_publication_v2_reader.py
      - run: uv run ruff format --check infrastructure_impact checks tests/test_architecture.py tests/test_expansion.py tests/test_release_sources.py tests/test_benchmark_boundaries.py tests/test_browser_capture.py tests/test_scorecards.py tests/test_arista_history.py tests/test_research_audit.py tests/test_reliability_review.py tests/test_archive.py tests/test_archive_listings.py tests/test_comparison_eligibility.py tests/test_evidence_quality.py tests/test_review_coverage.py tests/test_static_delivery.py tests/test_research_dossiers.py tests/test_vendor_gaps.py tests/test_advisory_gaps.py tests/test_history_batches.py tests/test_research_foundations.py tests/test_component_statements.py tests/test_source_observations.py tests/test_references.py tests/test_component_studies.py tests/test_source_selection.py tests/test_arista_legacy_scope.py tests/test_archive_replay.py tests/test_fortinet_ranges.py tests/test_f5_pdf.py tests/test_fortinet_openssh.py tests/test_arista_routing_scope.py tests/test_arista_management_scope.py tests/test_pan_notices.py tests/test_pan_bulletins.py tests/test_capacity_profiles.py tests/test_hosted_backup.py tests/test_juniper_apstra.py tests/test_normalizer_fingerprints.py tests/test_remediation_time.py tests/test_cisco_ucs.py tests/test_component_contract.py tests/test_checkpoint_index.py tests/test_remote_recovery.py tests/test_normalization_maintenance.py tests/test_product_cohorts.py tests/test_sbom_observations.py tests/test_build_inventory.py tests/test_build_pilot.py tests/test_investigations.py tests/test_disclosure_review.py tests/test_source_access.py tests/test_kev.py tests/test_kev_collection.py tests/test_kev_delivery.py tests/test_kev_monitor.py tests/test_eligibility_monitor.py tests/test_switching_monitor.py tests/test_switching_delivery.py tests/test_switching_summary_delivery.py tests/test_switching_evidence.py tests/test_switching_validation.py tests/test_switching_contracts.py tests/test_switching_final_fixes.py tests/test_switching_comparison.py tests/test_switching_backfill.py tests/test_cisco_openvuln.py tests/test_cisco_platform_scope.py tests/test_cvss_enrichment.py tests/test_writer_scaling.py tests/test_phase_events.py tests/test_aruba_text_coverage.py tests/test_arista_current_scope.py tests/test_arista_reconciliation.py tests/test_switching_scaling.py tests/test_coverage_notice_transitions.py tests/test_coverage_gaps.py tests/test_coverage_repairs_integration.py tests/test_cve_reconciliation_snapshot.py tests/test_cve_reconciliation_selectors.py tests/test_cve_reconciliation_state.py tests/test_cve_reconciliation_baseline.py tests/test_cve_reconciliation_report.py tests/test_cve_reconciliation_cli.py tests/test_current_evidence.py tests/test_arista_current_evidence.py tests/test_targeted_maintenance.py tests/test_current_evidence_delivery.py tests/test_current_evidence_monitor.py tests/test_hosted_maintenance.py tests/test_hosted_workflow_protocol.py tests/test_target_import_candidate.py tests/test_target_import_cli.py tests/test_target_import_contracts.py tests/test_target_import_distribution.py tests/test_target_import_preview.py tests/test_target_import_profiles.py tests/test_target_import_stage.py tests/test_target_import_transport.py tests/test_hosted_target_import.py ops tests/test_publication_v2_codec.py tests/test_publication_v2.py tests/test_publication_v2_reader.py
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: node tests/test_snapshot.js
      - run: node tests/test_kev.js
      - run: node tests/test_kev_ui.js
      - run: node tests/test_current_evidence.js
      - run: node tests/test_current_evidence_ui.js
      - run: node tests/test_publication_v2.js
      - run: node tests/test_switching.js
      - run: node tests/test_switching_ui.js
      # The dossier suite receives its synthetic stdin through pytest above.
      - run: uv run --group build python -m build --wheel --no-isolation
      - run: uv run python checks/distribution.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t infrastructure-impact:ci .
      - run: docker run --rm infrastructure-impact:ci plugins
      - run: docker compose config --quiet
